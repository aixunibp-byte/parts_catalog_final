name: Import final project
on:
  push:
    paths:
      - '.github/workflows/import-project.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aixunibp-byte/parts_catalog
          path: source-archive
          persist-credentials: false
      - name: Validate and unpack archive without executing project code
        shell: python
        run: |
          import pathlib, zipfile, shutil, re
          root = pathlib.Path.cwd()
          source = root / 'source-archive'
          archive = source / 'parts-catalog-full-2026-10-08.zip'
          staged = root / 'import-staging'
          staged.mkdir()
          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  p = pathlib.PurePosixPath(entry.filename)
                  if p.is_absolute() or '..' in p.parts or '\\' in entry.filename:
                      raise RuntimeError('Unsafe archive path')
                  if (entry.external_attr >> 16) & 0o170000 == 0o120000:
                      raise RuntimeError('Archive contains symlink')
                  if entry.file_size > 50 * 1024 * 1024:
                      raise RuntimeError('Oversized file; review required')
              if sum(e.file_size for e in z.infolist()) > 500 * 1024 * 1024:
                  raise RuntimeError('Oversized archive; review required')
              z.extractall(staged)
          base = staged
          while True:
              items = list(base.iterdir())
              if len(items) == 1 and items[0].is_dir():
                  base = items[0]
              else:
                  break
          files = [p for p in base.rglob('*') if p.is_file()]
          if not files:
              raise RuntimeError('Empty archive')
          for p in files:
              rel = p.relative_to(base)
              parts = rel.parts
              if any(x in {'.git', 'node_modules', '.venv', '__pycache__'} for x in parts):
                  raise RuntimeError('Generated or VCS directory; review required: ' + str(rel))
              if p.name == '.env' or (p.name.startswith('.env.') and p.name not in {'.env.example', '.env.sample', '.env.template'}):
                  raise RuntimeError('Environment secrets file; review required: ' + str(rel))
              if p.suffix.lower() in {'.pem', '.key', '.p12', '.pfx'} or p.name in {'id_rsa', 'id_ed25519'}:
                  raise RuntimeError('Potential private key; review required: ' + str(rel))
              if parts[:2] == ('.github', 'workflows'):
                  raise RuntimeError('Embedded workflow; review required: ' + str(rel))
              if parts[0] in {'source-archive', 'import-staging'}:
                  raise RuntimeError('Reserved path')
              data = p.read_bytes()
              if re.search(rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[A-Z0-9]{16}', data):
                  raise RuntimeError('Possible secret detected; review required: ' + str(rel))
          for p in files:
              destination = root / p.relative_to(base)
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(p, destination)
          shutil.rmtree(source)
          shutil.rmtree(staged)
          print('Imported files:', len(files))
      - name: Commit imported project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import final project from parts-catalog-full-2026-10-08.zip'
          git push origin HEAD:main
