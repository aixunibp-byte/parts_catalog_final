# Активировать после того, как получишь сертификат Let's Encrypt (см. README,
# раздел "Настройка HTTPS"). Замени omegation.ru на свой домен везде ниже,
# затем: cp nginx/nginx-ssl-example.conf nginx/nginx.conf && docker compose restart nginx

# ---------------------------------------------------------------------------
# Жёсткий контроль подключений
# (этот файл подключается внутрь http{} образа nginx:alpine, поэтому zone-директивы
#  можно держать здесь же)
# ---------------------------------------------------------------------------

# Ответ при превышении лимитов — 429 (а не 503 по умолчанию).
limit_req_status 429;
limit_conn_status 429;

# Ключи лимитов. ВАЖНО: в $uri после rewrite уже нет префикса /api/, поэтому
# сопоставляем по $request_uri — он остаётся исходным.
#   login_key — только вход в админку: очень строго;
#   admin_key — любые запросы к админ-API;
#   api_key   — остальное API, кроме выдачи фото (их десятки на страницу каталога).
# Пустой ключ = лимит к запросу не применяется.
map $request_uri $login_key {
    default "";
    "~^/api/admin/auth/login(\?|$)" $binary_remote_addr;
}
map $request_uri $admin_key {
    default "";
    "~^/api/admin/" $binary_remote_addr;
}
map $request_uri $api_key {
    default $binary_remote_addr;
    "~^/api/images/" "";
    "~^/api/admin/" "";
}

limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $api_key            zone=api:10m     rate=10r/s;
limit_req_zone $admin_key          zone=admin:10m   rate=10r/s;
limit_req_zone $login_key          zone=login:10m   rate=6r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# Не показывать версию nginx
server_tokens off;

# Любые запросы с чужим Host / по IP — без ответа.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    server_name omegation.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное — редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name omegation.ru;

    ssl_certificate     /etc/letsencrypt/live/omegation.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omegation.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Лимиты соединений и таймауты (против медленных атак и перебора) ---
    client_max_body_size 12M;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    large_client_header_buffers 4 8k;
    limit_conn perip 60;
    limit_req zone=general burst=100 nodelay;

    # Допустимые методы
    if ($request_method !~ ^(GET|HEAD|POST|PATCH|PUT|DELETE|OPTIONS)$) {
        return 405;
    }

    # Резолвим "api" лениво на каждый запрос через встроенный DNS Docker (127.0.0.11),
    # а не один раз при старте nginx. Без этого nginx падает намертво с "host not
    # found in upstream" при любой гонке между стартом nginx и контейнера api
    # и дальше не восстанавливается сам — только через docker compose restart nginx.
    resolver 127.0.0.11 valid=10s;

    # Заголовки безопасности. CSP: скрипты только свои; шрифты — Google Fonts;
    # картинки свои + https (внешние ссылки на фото, добавленные из админки).
    # ВАЖНО: add_header в location сбрасывает заголовки уровня server, поэтому в
    # location'ах ниже они повторены.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Нужно для выпуска/продления сертификата Let's Encrypt (certbot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Старые адреса админки больше не существуют (вход — только по секретному
    # /console/<uid>/login): отвечаем 404 на уровне nginx, без SPA-заглушки.
    location ~ ^/admin {
        return 404;
    }

    # Типичные сканеры и скрытые файлы: закрываем соединение без ответа.
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|pma|cgi-bin|vendor|server-status|actuator|\.env|\.git|\.svn|\.ht) {
        return 444;
    }
    location ~ /\.(?!well-known) {
        return 444;
    }

    location /api/ {
        # Лимиты: общий, по API (без выдачи фото), по админ-API и отдельно жёсткий
        # на вход (6 попыток/мин с IP, всплеск до 4). На бэкенде поверх этого есть
        # блокировка перебора пароля по БД и проверка секретного uid.
        # (limit_req в location заменяет серверный, поэтому общий лимит повторён)
        limit_req zone=general burst=100 nodelay;
        limit_req zone=api burst=30 nodelay;
        limit_req zone=admin burst=30 nodelay;
        limit_req zone=login burst=4 nodelay;

        # proxy_pass с переменной (нужно для ленивого DNS-резолвинга api, см.
        # комментарий про resolver выше) НЕ обрезает префикс /api/ сам, поэтому
        # обрезаем явно через rewrite. Порядок "set -> rewrite -> proxy_pass"
        # важен: не менять.
        set $upstream_api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        # Реальный IP — только то, что видит сам nginx. X-Forwarded-For НЕ
        # дополняем присланным клиентом значением (его можно подделать), а
        # перезаписываем: бэкенд доверяет X-Real-IP только от этого прокси.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 90s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public" always;
        # Загруженный файл никогда не исполняется и не встраивается как страница.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Админка: секретный адрес /console/<uid>/... Отдаём тот же SPA, но с
    # запретом индексации и без кэша. Сам uid проверяет бэкенд (X-Admin-Uid).
    location ^~ /console/ {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Файлы сборки имеют хеш в имени — кэшируем надолго.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # index.html не кэшируем: новая сборка применяется сразу.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
